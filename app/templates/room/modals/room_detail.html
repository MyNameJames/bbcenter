{# room_detail.html — Modal รายละเอียดการจองห้อง (migrate 2026-08-05: header → eyebrow+avatar ตาม vehicle_detail.html)
   JS: openEventDetail() อยู่ใน room.js
#}
<div class="modal fade" id="eventDetailModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="card modal-content border-0">

            {# ── Header: eyebrow + วันที่ + avatar ── #}
            <div style="padding:14px 20px 0">
                <div class="d-flex justify-content-between align-items-start gap-3 pt-2">
                    <div>
                        <div class="text-uppercase" style="font-size:.75rem;color:var(--bb-mut)">#รายละเอียดการจองห้องประชุม</div>
                        <div style="font-size:1.25rem;font-weight:700;color:var(--bb-str)" id="detailDateLine"></div>
                    </div>
                    <div id="detailStatusAvatar" class="bb-avatar flex-shrink-0" style="width:4.5rem;height:4.5rem;background:var(--bb-info-bg);color:var(--bb-info-tx)">
                        <span class="material-symbols-rounded" style="font-size:2.5rem">mindfulness</span>
                    </div>
                </div>
            </div>

            <div class="card-body">
                <hr class="bk-divider">

                <div class="bk-detail-info">
                    <div class="bk-detail-row">
                        <span class="material-symbols-rounded bk-detail-icon">schedule</span>
                        <span id="detailTime" class="bk-detail-text"></span>
                    </div>
                    <div class="bk-detail-row">
                        <span class="material-symbols-rounded bk-detail-icon">add_home</span>
                        <span id="detailRoom" class="bk-detail-text"></span>
                    </div>
                    <div class="bk-detail-row">
                        <span class="material-symbols-rounded bk-detail-icon">sell</span>
                        <span id="detailTitle" class="bk-detail-text"></span>
                    </div>
                </div>

                <hr class="bk-detail-divider">

                <div class="pt-3 pb-2">
                    <span class="bk-detail-section-label">ผู้จอง</span>
                </div>

                <div id="detailBookerBlock" class="pb-2"></div>

                <div id="detailActions" class="d-flex justify-content-end gap-2 mt-3"></div>
            </div>

        </div>
    </div>
</div>
