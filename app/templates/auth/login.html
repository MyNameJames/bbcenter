<!DOCTYPE html>
<html lang="th">
<head>
	<title>เข้าสู่ระบบ | BBCenter</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="icon" href="{{ url_for('static', filename='fonts/favicon_io/favicon-32x32.png') }}">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap">
	<link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='core/css/tokens.css') }}">
	<link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='auth/css/login.css') }}">
</head>
<body class="login-page">

	<span class="login-dots dots-tr"></span>
	<span class="login-dots dots-bl"></span>

	<div class="login-card">

		<!-- Brand -->
		<div class="login-brand">
			<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
				<path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/>
				<path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/>
				<path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/>
				<path d="M10 6h4"/><path d="M10 10h4"/><path d="M10 14h4"/><path d="M10 18h4"/>
			</svg>
			<span class="brand-name text-header">BB CENTER</span>
		</div>

		<!-- Heading -->
		<h1 class="login-title">ยินดีต้อนรับ 👋</h1>
		<p class="login-subtitle">เข้าสู่ระบบด้วยรหัสหน้าแดงที่ได้สมัครไว้แล้ว</p>

		<!-- Flash -->
		{% with messages = get_flashed_messages(with_categories=true) %}
			{% if messages %}
				{% for category, message in messages %}
					<div class="login-flash alert-{{ category }}" role="alert">
						{{ message }}
						<button type="button" class="flash-close" aria-label="ปิด"
								onclick="this.parentElement.remove()">&times;</button>
					</div>
				{% endfor %}
			{% endif %}
		{% endwith %}

		<!-- Form -->
		<form action="/login" method="POST" autocomplete="off">

			<div class="login-field">
				<label for="username">รหัสหน้าแดง</label>
				<div class="login-input-wrap">
					<input class="login-input" type="text" id="username" name="username"
						   placeholder="กรอกรหัสหน้าแดง" required autofocus>
				</div>
			</div>

			<div class="login-field">
				<label for="password">รหัสผ่าน</label>
				<div class="login-input-wrap">
					<input class="login-input has-toggle" type="password" id="password" name="password"
						   placeholder="••••••••" required>
					<button type="button" class="login-toggle" aria-label="แสดง/ซ่อนรหัสผ่าน">
						<svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
							<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>
						</svg>
						<svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none">
							<path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
							<path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
							<path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
							<line x1="2" x2="22" y1="2" y2="22"/>
						</svg>
					</button>
				</div>
			</div>

			<button type="submit" class="login-btn">เข้าสู่ระบบ</button>

		</form>
	</div>

	<script src="{{ url_for('static', filename='auth/js/login.js') }}"></script>
</body>
</html>
